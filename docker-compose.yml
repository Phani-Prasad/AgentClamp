# ─────────────────────────────────────────────────────────────────────────────
#  AgentClamp — docker-compose.yml
#  On-premises enterprise deployment
#
#  Quick start:
#    cp .env.example .env     # fill in your API keys
#    docker compose up -d     # start all services
#    open http://localhost    # access the platform
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentclamp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DB path to use the mounted volume
      DATABASE_URL: sqlite:////app/data/agentclamp.db
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      # Persistent data — survives container restarts and upgrades
      - db_data:/app/data
      - chroma_data:/app/chroma_db
      - output_data:/app/output
    networks:
      - agentclamp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # At build time, point the frontend at the nginx proxy (not raw backend port)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
    container_name: agentclamp-frontend
    restart: unless-stopped
    networks:
      - agentclamp_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: agentclamp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your SSL certificates here (optional — comment out if not using HTTPS)
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - agentclamp_net
    depends_on:
      - frontend
      - backend

# ── Named Volumes (data persists across upgrades) ────────────────────────────
volumes:
  db_data:
    driver: local
  chroma_data:
    driver: local
  output_data:
    driver: local

# ── Internal Network ─────────────────────────────────────────────────────────
networks:
  agentclamp_net:
    driver: bridge
