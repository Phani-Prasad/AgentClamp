# AgentClamp — Nginx Reverse Proxy Configuration
# Routes all traffic through port 80/443 so org IT only needs to open one port.
#
# Frontend:  http://your-server/         → Next.js :3000
# Backend:   http://your-server/api/     → FastAPI :8000
# WebSocket: ws://your-server/ws/        → FastAPI WebSocket :8000

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # ── API routes → FastAPI backend ──────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads for knowledge base documents
        client_max_body_size 50M;
    }

    # ── WebSocket → FastAPI backend ───────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;  # Keep WS alive for long agent runs
        proxy_send_timeout 3600s;
    }

    # ── Health check passthrough ──────────────────────────────────
    location /health {
        proxy_pass http://backend;
    }

    # ── Everything else → Next.js frontend ───────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Next.js HMR websocket (dev only — remove in production)
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}

